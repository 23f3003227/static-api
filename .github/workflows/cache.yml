name: Dependency Caching
on: [push]

jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/dummy-data
          key: cache-47b1f22

      - name: prime-cache-47b1f22
        run: |
          echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"
          mkdir -p ~/dummy-data
          echo "Sample data" > ~/dummy-data/file.txt